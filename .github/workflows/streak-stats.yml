name: Update streak stats

# Lancement manuel uniquement : le README utilise l'instance hebergee
# streak-stats.demolab.com. Reactiver le cron ci-dessous pour generer le SVG
# dans le repo (necessite un compte GitHub Actions fonctionnel).
on:
  # schedule:
  #   - cron: "47 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&disable_animations=true
          path: profile/streak-dark.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || github.token }}

      - name: Generate streak stats (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: profile/streak-light.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || github.token }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          git commit -m "Update streak stats" || exit 0
          git push
